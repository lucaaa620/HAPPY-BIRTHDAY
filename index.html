<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>SHAHIN — A BIRTHDAY JOURNEY</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <main id="scene-container"></main>

  <!-- CINEMATIC TEXT -->

  <section id="opening-screen" class="screen">

    <div id="opening-text" class="cinematic-text">
      EVERY STORY HAS A BEGINNING...
    </div>

  </section>


  <!-- TAP TO BEGIN -->

  <button id="start-button" class="start-button">

    <span class="tap-ring"></span>

    <span class="tap-label">
      TAP TO BEGIN
    </span>

  </button>


  <!-- YEAR -->

  <div id="year-display" class="year-display">
    2026
  </div>


  <!-- LOCATION -->

  <section id="location-screen" class="screen hidden">

    <div class="location-text">
      RAJASTHAN, INDIA
    </div>

    <div class="birth-date">
      30 AUGUST 2006
    </div>

  </section>


  <!-- FINAL REVEAL -->

  <section id="final-screen" class="screen hidden">

    <div class="final-line">
      AND HERE... A BEAUTIFUL STORY BEGAN.
    </div>

    <div class="final-subline">
      30 AUGUST 2006 — THE DAY SHAHIN'S STORY BEGAN.
    </div>

  </section>


  <!-- VIGNETTE -->

  <div class="vignette"></div>


  <!-- THREE.JS -->

  <script
    src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js">
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js">
  </script>

  <script src="js/scene1.js"></script>

</body>
</html>
